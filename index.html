<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengurusan Unit HEM - SK Simpang Rengam</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #1e3a8a; --pagi: #f59e0b; --petang: #6366f1; 
            --danger: #ef4444; --success: #10b981; --bg-body: #f1f5f9;
        }
        body { background: var(--bg-body); height: 100vh; overflow: hidden; display: flex; margin: 0; font-family: 'Inter', sans-serif; }
        
        /* Sidebar */
        .sidebar { background: white; width: 280px; border-right: 1px solid #e2e8f0; padding: 30px 20px; display: flex; flex-direction: column; flex-shrink: 0; box-shadow: 4px 0 10px rgba(0,0,0,0.02); }
        .brand { text-align: center; margin-bottom: 30px; cursor: pointer; }
        .nav-link { display: flex; align-items: center; padding: 14px 18px; color: #64748b; border-radius: 12px; margin-bottom: 8px; text-decoration: none; cursor: pointer; transition: 0.3s; font-weight: 500; }
        .nav-link:hover { background: #f8fafc; color: var(--primary); transform: translateX(5px); }
        .is-active { background: #eff6ff; color: var(--primary); font-weight: 700; border-left: 4px solid var(--primary); }
        .menu-label { margin-top: 20px; font-weight: 800; font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1.5px; }

        /* Main Area */
        .content-area { flex-grow: 1; background: var(--bg-body); position: relative; overflow-y: auto; }
        iframe { width: 100%; height: 100%; border: none; }

        /* Home Page Styling */
        .home-container { padding: 60px 40px; max-width: 1000px; margin: 0 auto; text-align: center; }
        .school-logo { width: 120px; margin-bottom: 20px; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1)); }
        .home-title { color: var(--primary); font-weight: 800; font-size: 2.5rem; margin-bottom: 5px; }
        .home-subtitle { color: #64748b; font-size: 1.2rem; font-weight: 500; margin-bottom: 40px; }
        
        .home-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
        .menu-card { 
            background: white; padding: 30px 20px; border-radius: 20px; 
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); transition: 0.3s; 
            cursor: pointer; border: 1px solid transparent;
        }
        .menu-card:hover { transform: translateY(-10px); border-color: var(--primary); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        .menu-card i { font-size: 2.5rem; margin-bottom: 15px; display: block; }

        /* Status Cards */
        .status-container { padding: 40px; max-width: 1100px; margin: 0 auto; }
        .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .card-item { background: white; padding: 20px; border-radius: 16px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border-left: 6px solid #cbd5e1; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .card-danger { border-left-color: var(--danger); background: #fff5f5; animation: pulse-red 2s infinite; }
        @keyframes pulse-red { 0% {box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4);} 70% {box-shadow: 0 0 0 10px rgba(239, 68, 68, 0);} 100% {box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);} }
        .card-success { border-left-color: var(--success); }
        .status-pill { padding: 8px 16px; border-radius: 99px; font-size: 0.75rem; font-weight: 800; }
        .pill-danger { background: var(--danger); color: white; }
        .pill-success { background: #d1fae5; color: #065f46; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="brand" onclick="showHome()">
            <img src="logo_sksr.png" alt="Logo" class="mb-2" style="width: 60px;" onerror="this.src='https://via.placeholder.com/60?text=SKSR'">
            <p class="title is-6 mb-0" style="color: var(--primary)">Laporan Guru Bertugas</p>
            <p class="is-size-7 has-text-grey">SK SIMPANG RENGAM</p>
        </div>

        <a class="nav-link is-active" id="nav-home" onclick="showHome()">
            <i class="fas fa-home mr-3"></i> Laman Utama
        </a>

        <p class="menu-label">Pengurusan</p>
        <a class="nav-link" id="nav-borang" onclick="loadIframe('https://laporangurubertugas.vercel.app/', this)">
            <i class="fas fa-pen-nib mr-3"></i> Isi Laporan
        </a>

        <p class="menu-label">Semakan Status</p>
        <a class="nav-link" id="nav-harian" onclick="fetchStatus('harian', 'Keciciran Laporan Harian', this)">
            <i class="fas fa-exclamation-triangle mr-3" style="color: var(--danger)"></i> Status Harian
        </a>
        <a class="nav-link" id="nav-perhimpunan" onclick="fetchStatus('perhimpunan', 'Keciciran Perhimpunan', this)">
            <i class="fas fa-bullhorn mr-3" style="color: var(--petang)"></i> Status Perhimpunan
        </a>

        <p class="menu-label">Jadual</p>
        <a class="nav-link" id="nav-jadual" onclick="loadIframe('halaman_jadual.html', this)">
            <i class="fas fa-calendar-alt mr-3" style="color: #6366f1"></i> Jadual Bertugas
        </a>
        <a class="nav-link" id="nav-arkib" onclick="loadIframe('https://drive.google.com/embeddedfolderview?id=1acBG0cKktF1Qk2-MMLiNBzHd5i_yaatR#list', this)">
            <i class="fas fa-folder-open mr-3" style="color: #f59e0b"></i> Laporan PDF
        </a>
    </div>

    <div class="content-area" id="mainView">
        </div>

    <script>
        // Fungsi untuk Laman Utama
        function showHome() {
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('is-active'));
            document.getElementById('nav-home').classList.add('is-active');
            
            const display = document.getElementById('mainView');
            display.innerHTML = `
                <div class="home-container animate__animated animate__fadeIn">
                    <img src="logo_sksr.png" class="school-logo" onerror="this.src='https://via.placeholder.com/120?text=LOGO'">
                    <h1 class="home-title">PENGURUSAN UNIT HEM</h1>
                    <p class="home-subtitle text-uppercase">SK Simpang Rengam • Laporan Guru Bertugas</p>
                    
                    <div class="home-grid">
                        <div class="menu-card" onclick="loadIframe('https://laporangurubertugas.vercel.app/', document.getElementById('nav-borang'))">
                            <i class="fas fa-edit" style="color: var(--primary)"></i>
                            <span class="has-text-weight-bold">ISI LAPORAN</span>
                        </div>
                        <div class="menu-card" onclick="fetchStatus('harian', 'Keciciran Laporan Harian', document.getElementById('nav-harian'))">
                            <i class="fas fa-tasks" style="color: var(--danger)"></i>
                            <span class="has-text-weight-bold">STATUS HARIAN</span>
                        </div>
                        <div class="menu-card" onclick="loadIframe('halaman_jadual.html', document.getElementById('nav-jadual'))">
                            <i class="fas fa-calendar-check" style="color: var(--petang)"></i>
                            <span class="has-text-weight-bold">JADUAL BERTUGAS</span>
                        </div>
                        <div class="menu-card" onclick="loadIframe('https://drive.google.com/embeddedfolderview?id=1acBG0cKktF1Qk2-MMLiNBzHd5i_yaatR#list', document.getElementById('nav-arkib'))">
                            <i class="fas fa-file-pdf" style="color: #f59e0b"></i>
                            <span class="has-text-weight-bold">ARKIB PDF</span>
                        </div>
                    </div>
                    
                    <p class="mt-6 is-size-7 has-text-grey-light">Sistem Inovasi Digital: D'SiRe © 2026</p>
                </div>
            `;
        }

        // Fungsi Load Iframe
        function loadIframe(url, element) {
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('is-active'));
            if(element) element.classList.add('is-active');
            document.getElementById('mainView').innerHTML = `<iframe src="${url}"></iframe>`;
        }

        // Fungsi Semakan Status Google Sheets
        async function fetchStatus(type, title, element) {
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('is-active'));
            if(element) element.classList.add('is-active');
            const display = document.getElementById('mainView');
            display.innerHTML = `<div class="status-container has-text-centered"><p class="mt-6"><i class="fas fa-sync fa-spin fa-2x"></i><br>Menyemak rekod keciciran...</p></div>`;

            try {
                const sheetId = '1qN7sWgJ0LF6xtFz9r6uHCzapTV1keGqUvygsi_9ggr8';
                const gid = '164291436';
                const res = await fetch(`https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&gid=${gid}`);
                const csv = await res.text();
                const rows = csv.split('\n').map(r => r.split(','));

                const colPagi = (type === 'harian') ? 5 : 7;
                const colPetang = (type === 'harian') ? 6 : 8;
                const startDate = new Date(2026, 4, 4);
                const today = new Date();

                const filterData = (idx) => {
                    return rows.slice(1).map(row => {
                        const dateStr = row[0].trim();
                        const parts = dateStr.split('/');
                        if (parts.length !== 3) return null;
                        const rDate = new Date(parts[2], parts[1]-1, parts[0]);
                        if (rDate < startDate || rDate > today) return null;
                        if (type === 'perhimpunan' && rDate.getDay() !== 1) return null;
                        const st = (row[idx] || "").trim();
                        return { 
                            date: dateStr, 
                            day: rDate.toLocaleDateString('ms-MY', { weekday: 'long' }), 
                            status: st === "LENGKAP" ? "LENGKAP" : "BELUM ISI" 
                        };
                    }).filter(i => i !== null).reverse();
                };

                const listPagi = filterData(colPagi);
                const listPetang = filterData(colPetang);

                display.innerHTML = `
                    <div class="status-container">
                        <div class="mb-5"><button class="button is-small is-light" onclick="showHome()"><i class="fas fa-arrow-left mr-2"></i> Kembali</button></div>
                        <h1 class="title is-4 mb-6 has-text-centered" style="color: var(--primary)">${title}</h1>
                        <div class="status-grid">
                            <div><div class="session-header has-text-weight-bold mb-4" style="color:var(--pagi)"><i class="fas fa-sun mr-2"></i> SESI PAGI</div>
                                ${listPagi.map(item => `<div class="card-item ${item.status === 'BELUM ISI' ? 'card-danger' : 'card-success'}"><div><span class="has-text-weight-bold is-size-5">${item.date}</span><br><small class="is-uppercase">${item.day}</small></div><span class="status-pill ${item.status === 'BELUM ISI' ? 'pill-danger' : 'pill-success'}">${item.status}</span></div>`).join('')}
                            </div>
                            <div><div class="session-header has-text-weight-bold mb-4" style="color:var(--petang)"><i class="fas fa-moon mr-2"></i> SESI PETANG</div>
                                ${listPetang.map(item => `<div class="card-item ${item.status === 'BELUM ISI' ? 'card-danger' : 'card-success'}"><div><span class="has-text-weight-bold is-size-5">${item.date}</span><br><small class="is-uppercase">${item.day}</small></div><span class="status-pill ${item.status === 'BELUM ISI' ? 'pill-danger' : 'pill-success'}">${item.status}</span></div>`).join('')}
                            </div>
                        </div>
                    </div>`;
            } catch (e) {
                display.innerHTML = `<div class="notification is-danger">Ralat memuatkan data.</div>`;
            }
        }

        window.onload = showHome;
    </script>
</body>
</html>
