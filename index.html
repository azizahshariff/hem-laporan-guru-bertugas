<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D'Sire Dashboard-iHem SK Simpang Rengam</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #f0f2f5; height: 100vh; overflow: hidden; display: flex; }
        .sidebar { background: white; width: 250px; border-right: 1px solid #ddd; padding: 20px; display: flex; flex-direction: column; }
        .content { flex-grow: 1; position: relative; background: white; }
        iframe { width: 100%; height: 100%; border: none; }
        .nav-link { display: flex; align-items: center; padding: 10px; color: #4a4a4a; border-radius: 8px; margin-bottom: 5px; text-decoration: none; }
        .nav-link:hover { background: #f5f5f5; color: #2563eb; }
        .is-active { background: #eff6ff; color: #2563eb; font-weight: bold; }
        .menu-label { margin-top: 20px; font-weight: bold; font-size: 0.75rem; color: #888; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="has-text-centered mb-5">
            <p class="title is-6">Laporan Guru Bertugas</p>
            <p class="subtitle is-7">SK Simpang Rengam</p>
        </div>

        <p class="menu-label">Menu Utama</p>
        <a href="https://laporangurubertugas.vercel.app/" class="nav-link is-active" target="contentFrame">
            <i class="fas fa-edit mr-3"></i> Isi Laporan
        </a>

        <p class="menu-label">Pemantauan Cicir</p>
        <a href="https://docs.google.com/spreadsheets/d/e/2PACX-1vSH78MK8CA10BgG4ZjrgQxFEvhD_PyOHFg1nVJID7XNp0vvsLSae5iluY4LkLF2_FOKN5NM_WlLSQdO/pubhtml?gid=120516629&single=true&range=D1:D25" class="nav-link" target="contentFrame">
            <i class="fas fa-calendar-times mr-3"></i> Cicir: Harian
        </a>
        <a href="https://docs.google.com/spreadsheets/d/e/2PACX-1vSH78MK8CA10BgG4ZjrgQxFEvhD_PyOHFg1nVJID7XNp0vvsLSae5iluY4LkLF2_FOKN5NM_WlLSQdO/pubhtml?gid=120516629&single=true&range=E1:E25" class="nav-link" target="contentFrame">
            <i class="fas fa-users-slash mr-3"></i> Cicir: Perhimpunan
        </a>

        <p class="menu-label">Lain-lain</p>
        <a href="halaman_jadual.html" class="nav-link" target="contentFrame">
            <i class="fas fa-calendar-alt mr-3"></i> Jadual Bertugas
        </a>
    </div>

    <div class="content">
        <iframe name="contentFrame" src="https://laporangurubertugas.vercel.app/"></iframe>
    </div>

    <script>
        const links = document.querySelectorAll('.nav-link');
        links.forEach(link => {
            link.addEventListener('click', () => {
                links.forEach(l => l.classList.remove('is-active'));
                link.classList.add('is-active');
            });
        });
    </script>
</body>
</html>
