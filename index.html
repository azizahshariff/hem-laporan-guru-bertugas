<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D'SiRe Dashboard - iHEM SK Simpang Rengam</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --primary: #1e3a8a; 
            --pagi: #f59e0b; 
            --petang: #6366f1; 
            --danger: #ef4444; 
            --success: #10b981;
            --bg-body: #f1f5f9;
        }
        body { background: var(--bg-body); height: 100vh; overflow: hidden; display: flex; margin: 0; font-family: 'Inter', sans-serif; }
        
        /* Sidebar Styling */
        .sidebar { background: white; width: 280px; border-right: 1px solid #e2e8f0; padding: 30px 20px; display: flex; flex-direction: column; flex-shrink: 0; box-shadow: 4px 0 10px rgba(0,0,0,0.02); }
        .brand { text-align: center; margin-bottom: 30px; }
        .nav-link { display: flex; align-items: center; padding: 14px 18px; color: #64748b; border-radius: 12px; margin-bottom: 8px; text-decoration: none; cursor: pointer; transition: all 0.3s ease; font-weight: 500; }
        .nav-link:hover { background: #f8fafc; color: var(--primary); transform: translateX(5px); }
        .is-active { background: #eff6ff; color: var(--primary); font-weight: 700; box-shadow: inset 4px 0 0 var(--primary); }
        .menu-label { margin-top: 25px; font-weight: 800; font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1.5px; margin-left: 10px; }

        /* Main Area */
        .content-area { flex-grow: 1; background: var(--bg-body); position: relative; }
        iframe { width: 100%; height: 100%; border: none; }

        /* Dashboard Cards Styling */
        .status-container { padding: 40px; max-width: 1100px; margin: 0 auto; height: 100%; overflow-y: auto; }
        .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .session-section { background: transparent; }
        .session-header { font-size: 1.2rem; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; color: #334155; }
        .session-header i { margin-right: 10px; }

        /* Status Card */
        .card-item { 
            background: white; 
            padding: 20px; 
            border-radius: 16px; 
            margin-bottom: 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            transition: all 0.3s;
            border-left: 6px solid #cbd5e1;
        }

        /* Amaran Merah (Belum Isi) */
        .card-danger { 
            border-left-color: var(--danger); 
            background: #fff5f5;
            animation: pulse-red 2s infinite;
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        /* Hijau (Lengkap) */
        .card-success { border-left-color: var(--success); }

        .date-info { display: flex; flex-direction: column; }
        .date-main { font-size: 1.1rem; font-weight: 700; color: #1e293b; }
        .day-sub { font-size: 0.85rem; color: #64748b; text-transform: uppercase; }

        .status-pill { 
            padding: 8px 16px; 
            border-radius: 99px; 
            font-size: 0.75rem; 
            font-weight: 800; 
            letter-spacing: 0.5px;
        }
        .pill-danger { background: var(--danger); color: white; }
        .pill-success { background: #d1fae5; color: #065f46; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="brand">
            <p class="title is-5 mb-0" style="color: var(--primary)">LAPORAN GURU BERTUGAS</p>
            <p class="is-size-7 has-text-grey">SK SIMPANG RENGAM</p>
        </div>

        <p class="menu-label">Isi Laporan</p>
        <a class="nav-link is-active" onclick="loadIframe('https://laporangurubertugas.vercel.app/', this)">
            <i class="fas fa-pen-nib mr-3"></i> Borang Laporan
        </a>

        <p class="menu-label">Status Laporan</p>
        <a class="nav-link" onclick="fetchStatus('harian', 'Keciciran Laporan Harian', this)">
            <i class="fas fa-exclamation-triangle mr-3" style="color: var(--danger)"></i> Status Harian
        </a>
        <a class="nav-link" onclick="fetchStatus('perhimpunan', 'Keciciran Perhimpunan', this)">
            <i class="fas fa-bullhorn mr-3" style="color: var(--petang)"></i> Status Perhimpunan
        </a>

        <p class="menu-label">Laporan</p>
        <a class="nav-link" onclick="loadIframe('https://drive.google.com/embeddedfolderview?id=1acBG0cKktF1Qk2-MMLiNBzHd5i_yaatR#list', this)">
            <i class="fas fa-folder-open mr-3" style="color: #f59e0b"></i> Laporan PDF
        </a>
    </div>

    <div class="content-area" id="mainView">
        <iframe src="https://laporangurubertugas.vercel.app/"></iframe>
    </div>

    <script>
        function loadIframe(url, element) {
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('is-active'));
            element.classList.add('is-active');
            document.getElementById('mainView').innerHTML = `<iframe src="${url}"></iframe>`;
        }

        async function fetchStatus(type, title, element) {
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('is-active'));
            element.classList.add('is-active');
            const display = document.getElementById('mainView');
            display.innerHTML = `<div class="status-container has-text-centered"><p class="mt-6"><i class="fas fa-circle-notch fa-spin fa-2x"></i><br>Sedang menyemak rekod...</p></div>`;

            try {
                const sheetId = '1qN7sWgJ0LF6xtFz9r6uHCzapTV1keGqUvygsi_9ggr8';
                const gid = '164291436';
                const res = await fetch(`https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&gid=${gid}`);
                const csv = await res.text();
                const rows = csv.split('\n').map(r => r.split(','));

                const colPagi = (type === 'harian') ? 5 : 7;
                const colPetang = (type === 'harian') ? 6 : 8;

                const startDate = new Date(2026, 4, 4); // 4 Mei 2026
                const today = new Date();

                const getDayName = (dateStr) => {
                    const parts = dateStr.split('/');
                    const d = new Date(parts[2], parts[1]-1, parts[0]);
                    return d.toLocaleDateString('ms-MY', { weekday: 'long' });
                };

                const filterData = (idx) => {
                    return rows.slice(1).map(row => {
                        const dateStr = row[0].trim();
                        const parts = dateStr.split('/');
                        if (parts.length !== 3) return null;
                        const rDate = new Date(parts[2], parts[1]-1, parts[0]);
                        
                        if (rDate < startDate || rDate > today) return null;
                        if (type === 'perhimpunan' && rDate.getDay() !== 1) return null;

                        const st = (row[idx] || "").trim();
                        return { date: dateStr, day: getDayName(dateStr), status: st === "LENGKAP" ? "LENGKAP" : "BELUM ISI" };
                    }).filter(i => i !== null).reverse();
                };

                const listPagi = filterData(colPagi);
                const listPetang = filterData(colPetang);

                display.innerHTML = `
                    <div class="status-container">
                        <h1 class="title is-3 mb-6 has-text-centered" style="color: var(--primary)">${title}</h1>
                        <div class="status-grid">
                            <div class="session-section">
                                <div class="session-header" style="color: var(--pagi)"><i class="fas fa-sun"></i> SESI PAGI</div>
                                ${listPagi.map(item => `
                                    <div class="card-item ${item.status === 'BELUM ISI' ? 'card-danger' : 'card-success'}">
                                        <div class="date-info">
                                            <span class="date-main">${item.date}</span>
                                            <span class="day-sub">${item.day}</span>
                                        </div>
                                        <span class="status-pill ${item.status === 'BELUM ISI' ? 'pill-danger' : 'pill-success'}">${item.status}</span>
                                    </div>
                                `).join('')}
                            </div>
                            <div class="session-section">
                                <div class="session-header" style="color: var(--petang)"><i class="fas fa-moon"></i> SESI PETANG</div>
                                ${listPetang.map(item => `
                                    <div class="card-item ${item.status === 'BELUM ISI' ? 'card-danger' : 'card-success'}">
                                        <div class="date-info">
                                            <span class="date-main">${item.date}</span>
                                            <span class="day-sub">${item.day}</span>
                                        </div>
                                        <span class="status-pill ${item.status === 'BELUM ISI' ? 'pill-danger' : 'pill-success'}">${item.status}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>`;
            } catch (e) {
                display.innerHTML = `<div class="notification is-danger">Ralat menarik data. Pastikan Google Sheets di-Publish sebagai CSV.</div>`;
            }
        }
    </script>
</body>
</html>
