<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D'Sire Dashboard-iHEM SK Simpang Rengam</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-bg: #f0f2f5;
            --sidebar-color: #ffffff;
            --accent-color: #2563eb;
            --danger-color: #dc2626;
        }
        body { background-color: var(--primary-bg); height: 100vh; display: flex; flex-direction: column; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sidebar { background-color: var(--sidebar-color); border-right: 1px solid #e5e7eb; padding: 1.5rem; height: 100%; overflow-y: auto; }
        .nav-item { display: flex; align-items: center; padding: 0.75rem 1rem; border-radius: 0.5rem; color: #4b5563; margin-bottom: 0.3rem; transition: all 0.2s; cursor: pointer; border: 1px solid transparent; text-decoration: none; }
        .nav-item:hover { background-color: #f3f4f6; color: var(--accent-color); border-color: #e5e7eb; }
        .nav-item.is-active { background-color: #eff6ff; color: var(--accent-color); font-weight: 600; border-left: 4px solid var(--accent-color); }
        .content-area { flex-grow: 1; padding: 0; background: #fff; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }
        .school-header { padding-bottom: 1rem; margin-bottom: 1rem; border-bottom: 2px solid #f3f4f6; }
        .menu-label { font-weight: 700; color: #1f2937; margin-top: 1.2rem; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; }
    </style>
</head>
<body>

    <div class="columns is-gapless" style="height: 100%;">
        <div class="column is-2 sidebar">
            <div class="school-header has-text-centered">
                <img src="logo_sksr.png" alt="Logo SKSR" style="width: 60px; margin-bottom: 0.5rem;" onerror="this.style.display='none'">
                <p class="title is-6">Laporan Guru Bertugas</p>
                <p class="subtitle is-7">SK Simpang Rengam</p>
            </div>

            <aside class="menu">
                <p class="menu-label">Pengisian</p>
                <ul class="menu-list">
                    <li>
                        <a href="https://laporangurubertugas.vercel.app/" class="nav-item is-active" target="contentFrame">
                            <i class="fas fa-edit mr-3"></i> Isi Laporan Guru
                        </a>
                    </li>
                </ul>

                <p class="menu-label" style="color: var(--danger-color);">Pemantauan (Cicir)</p>
                <ul class="menu-list">
                    <li>
                        <a href="https://docs.google.com/spreadsheets/d/e/2PACX-1vSH78MK8CA10BgG4ZjrgQxFEvhD_PyOHFg1nVJID7XNp0vvsLSae5iluY4LkLF2_FOKN5NM_WlLSQdO/pubhtml?gid=120516629&single=true&range=D1:D25" class="nav-item" style="color: var(--danger-color);" target="contentFrame">
                            <i class="fas fa-calendar-times mr-3"></i> Cicir: Harian
                        </a>
                    </li>
                    <li>
                        <a href="https://docs.google.com/spreadsheets/d/e/2PACX-1vSH78MK8CA10BgG4ZjrgQxFEvhD_PyOHFg1nVJID7XNp0vvsLSae5iluY4LkLF2_FOKN5NM_WlLSQdO/pubhtml?gid=120516629&single=true&range=E1:E25" class="nav-item" style="color: #7c3aed;" target="contentFrame">
                            <i class="fas fa-users-slash mr-3"></i> Cicir: Perhimpunan
                        </a>
                    </li>
                </ul>

                <p class="menu-label">Data & Pentadbiran</p>
                <ul class="menu-list">
                    <li>
                        <a href="https://docs.google.com/spreadsheets/d/e/2PACX-1vSH78MK8CA10BgG4ZjrgQxFEvhD_PyOHFg1nVJID7XNp0vvsLSae5iluY4LkLF2_FOKN5NM_WlLSQdO/pubhtml?gid=0&single=true" class="nav-item" target="contentFrame">
                            <i class="fas fa-table mr-3"></i> Data Master
                        </a>
                    </li>
                    <li>
                        <a href="halaman_jadual.html" class="nav-item" target="contentFrame">
                            <i class="fas fa-calendar-alt mr-3"></i> Jadual Bertugas
                        </a>
                    </li>
                </ul>
            </aside>
        </div>

        <div class="column content-area">
            <iframe name="contentFrame" src="https://laporangurubertugas.vercel.app/"></iframe>
        </div>
    </div>

    <script>
        // Script untuk memastikan menu yang diklik menjadi 'is-active'
        const navItems = document.querySelectorAll('.nav-item');
        navItems.forEach(item => {
            item.addEventListener('click', () => {
                navItems.forEach(i => i.classList.remove('is-active'));
                item.classList.add('is-active');
            });
        });
    </script>
</body>
</html>
