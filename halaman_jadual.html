<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #ffffff; padding: 30px; margin: 0; }
        .section-title {
            background: #1e3a8a; color: white; padding: 12px 20px;
            border-radius: 10px; margin: 30px 0 20px 0; font-size: 18px;
        }
        .grid-jadual {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }
        .kad {
            background: #f8fafc; padding: 15px; border-radius: 12px;
            border: 1px solid #e2e8f0; text-align: center;
        }
        .kad img {
            width: 100%; height: 160px; object-fit: cover;
            border-radius: 8px; border: 1px solid #ddd;
        }
        .kad p { font-weight: bold; color: #1e3a8a; margin: 10px 0 0 0; }
    </style>
</head>
<body>
    <h2 style="text-align: center; color: #1e3a8a;">Jadual Tugasan Mingguan Guru</h2>

    <div class="section-title">SESI PAGI</div>
    <div class="grid-jadual">
        <div class="kad"><img src="pagi_kump1.png"><p>Kumpulan 1 (Pagi)</p></div>
        <div class="kad"><img src="pagi_kump2.png"><p>Kumpulan 2 (Pagi)</p></div>
        <div class="kad"><img src="pagi_kump3.png"><p>Kumpulan 3 (Pagi)</p></div>
        <div class="kad"><img src="pagi_kump4.png"><p>Kumpulan 4 (Pagi)</p></div>
    </div>

    <div class="section-title" style="background: #475569;">SESI PETANG</div>
    <div class="grid-jadual">
        <div class="kad"><img src="petang_kump1.png"><p>Kumpulan 1 (Petang)</p></div>
        <div class="kad"><img src="petang_kump2.png"><p>Kumpulan 2 (Petang)</p></div>
        <div class="kad"><img src="petang_kump3.png"><p>Kumpulan 3 (Petang)</p></div>
        <div class="kad"><img src="petang_kump4.png"><p>Kumpulan 4 (Petang)</p></div>
    </div>
</body>
</html>
